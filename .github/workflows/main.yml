- name: 🔐 Configurar contraseña de administrador de OpenBullet 2
        env:
          OB2_ADMIN_PASSWORD: ${{ secrets.OB2_ADMIN_PASSWORD }}
        run: |
          set -e

          # Asegurarnos de que la carpeta UserData exista antes de arrancar OB2
          mkdir -p "$HOME/OpenBullet2/UserData"
          CONFIG="$HOME/OpenBullet2/UserData/OpenBulletSettings.json"

          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-bcrypt

          python3 <<'PY'
          import os
          import json
          import bcrypt

          config_path = os.path.expanduser("~/OpenBullet2/UserData/OpenBulletSettings.json")
          password = os.environ.get("OB2_ADMIN_PASSWORD")

          if not password:
              raise SystemExit("ERROR: OB2_ADMIN_PASSWORD no está configurado.")

          # Generar el hash de la contraseña del secreto
          password_hash = bcrypt.hashpw(
              password.encode("utf-8"),
              bcrypt.gensalt(rounds=10)
          ).decode("utf-8")

          # Plantilla base de OpenBulletSettings.json con los valores por defecto
          config = {
            "GeneralSettings": {
              "ConfigSectionOnLoad": 2,
              "AutoSetRecommendedBots": True,
              "WarnConfigNotSaved": True,
              "WarnDangerousConfig": True,
              "DefaultAuthor": "Anonymous",
              "UpdateChannel": 0,
              "EnableJobLogging": False,
              "LogBufferSize": 30,
              "IgnoreWordlistNameOnHitsDedupe": False,
              "ProxyCheckTargets": [
                {
                  "Url": "https://google.com",
                  "SuccessKey": "title>Google"
                }
              ],
              "DefaultJobDisplayMode": 0,
              "JobUpdateInterval": 1000,
              "JobManagerUpdateInterval": 1000,
              "GroupCapturesInDebugger": False,
              "Culture": "en",
              "CustomSnippets": []
            },
            "RemoteSettings": {
              "ConfigsEndpoints": []
            },
            "SecuritySettings": {
              "AllowSystemWideFileAccess": False,
              "RequireAdminLogin": True,  # Modificado para requerir login
              "AdminUsername": "admin",
              "AdminPasswordHash": password_hash,  # Contraseña hasheada inyectada
              "AdminApiKey": "",
              "JwtKey": "Ye/3yjSeXzEZv5A6iy/RE9Vmsm0PFS8RF1jJI7Ct2PyqcbasHIZa13EEiGgh1gV46Z4R5XZzk3cdb4L256qm8w==",
              "AdminSessionLifetimeHours": 24,
              "GuestSessionLifetimeHours": 24,
              "HttpsRedirect": False
            },
            "CustomizationSettings": {
              "Theme": "Default",
              "MonacoTheme": "vs-dark",
              "WordWrap": False,
              "BackgroundMain": "#222",
              "BackgroundInput": "#282828",
              "BackgroundSecondary": "#111",
              "ForegroundMain": "#DCDCDC",
              "ForegroundInput": "#DCDCDC",
              "ForegroundGood": "#ADFF2F",
              "ForegroundBad": "#FF6347",
              "ForegroundCustom": "#FF8C00",
              "ForegroundRetry": "#FFFF00",
              "ForegroundBanned": "#DDA0DD",
              "ForegroundToCheck": "#7FFFD4",
              "ForegroundMenuSelected": "#1E90FF",
              "SuccessButton": "#2f5738",
              "PrimaryButton": "#3b3a63",
              "WarningButton": "#7a552a",
              "DangerButton": "#693838",
              "ForegroundButton": "#DCDCDC",
              "BackgroundButton": "#282828",
              "BackgroundImagePath": "",
              "BackgroundOpacity": 100.0,
              "PlaySoundOnHit": False
            }
          }

          # Escribir el archivo
          with open(config_path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("Archivo OpenBulletSettings.json pre-generado con la contraseña de administrador correctamente.")
          PY
