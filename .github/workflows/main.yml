name: Entorno Windows con RDP (Bore)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Configurar contraseña de Windows
        run: |
          # Establecemos la contraseña para el usuario runneradmin
          $Password = ConvertTo-SecureString "GithubRdp2026!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $Password
        shell: powershell
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 📦 Descargar OpenBullet 2
        shell: pwsh
        run: |
          $destino = "C:\OpenBullet2"
      
          New-Item -ItemType Directory -Path $destino -Force | Out-Null
      
          $updater = "$destino\ob2-web-updater-win-x64.exe"
      
          Invoke-WebRequest `
            -Uri "https://github.com/openbullet/openbullet2/releases/latest/download/ob2-web-updater-win-x64.exe" `
            -OutFile $updater
      
          Write-Host "Updater descargado en: $updater"

      - name: 📦 Instalar cloudflared
        shell: pwsh
        run: |
          $msi = "$env:TEMP\cloudflared.msi"
      
          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.msi" `
            -OutFile $msi
      
          Write-Host "Instalando cloudflared..."
      
          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru
      
          if ($process.ExitCode -ne 0) {
            throw "La instalación de cloudflared falló. ExitCode: $($process.ExitCode)"
          }
      
          Write-Host "cloudflared instalado correctamente."
      
          # Recargar PATH para esta sesión
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" +
                      [System.Environment]::GetEnvironmentVariable("Path", "User")
      
          $cloudflared = Get-Command cloudflared.exe -ErrorAction SilentlyContinue
      
          if ($cloudflared) {
            Write-Host "Encontrado: $($cloudflared.Source)"
            & $cloudflared.Source --version
          } else {
            Write-Host "No se encontró cloudflared en PATH."
            Write-Host "Buscando el ejecutable..."
      
            $found = Get-ChildItem `
              -Path "C:\Program Files", "C:\Program Files (x86)" `
              -Filter "cloudflared.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1
      
            if (-not $found) {
              throw "cloudflared.exe no fue encontrado después de la instalación."
            }
      
            Write-Host "Encontrado en: $($found.FullName)"
            & $found.FullName --version
          }
      - name: Habilitar Escritorio Remoto (RDP)
        run: |
          # Activar RDP en el registro de Windows
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          
          # Habilitar la regla en el Firewall de Windows
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Iniciar el servicio de Terminal Server
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService
        shell: powershell

      - name: Descargar e iniciar Bore (Oculto)
        run: |
          Write-Host "Obteniendo la última versión de bore..."
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "x86_64-pc-windows-msvc.zip" }
          
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "."
          
          Write-Host "Iniciando túnel en segundo plano..."
          
          # CORRECCIÓN: Usamos Start-Process con argumentos para ocultar la ventana
          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 3389 --to bore.pub" -WindowStyle Hidden -ErrorAction SilentlyContinue
          
          # Esperamos unos segundos para que bore se conecte y nos de el puerto
          Start-Sleep -Seconds 5
        shell: powershell
