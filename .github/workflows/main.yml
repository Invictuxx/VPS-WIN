name: Entorno Ubuntu con SSH (Bore), OpenBullet 2 y Cloudflare

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar contraseña de Ubuntu y SSH
        run: |
          # Establecemos la contraseña para el usuario 'runner'
          echo "runner:GithubSsh2026!" | sudo chpasswd
          
          # Habilitamos la autenticación por contraseña en SSH
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config.d/*.conf || true
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
          
          # Reiniciamos el servicio SSH para aplicar los cambios
          sudo systemctl restart ssh
        shell: bash

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Instalar e Iniciar OpenBullet 2
        run: |
          DESTINO="$HOME/OpenBullet2"
          mkdir -p "$DESTINO"
          cd "$DESTINO"
          
          echo "Descargando la última versión de OpenBullet 2..."
          # Usamos el redireccionamiento directo de GitHub (más seguro y sin límites de API)
          wget -q --show-progress -L "https://github.com/openbullet/OpenBullet2/releases/download/2.0.1/OpenBullet2.Web-linux-x64.zip" -O OpenBullet2.zip
          
          # Comprobamos que el archivo ZIP no esté vacío antes de extraer
          if [ ! -s OpenBullet2.zip ]; then
            echo "Error: El archivo OpenBullet2.zip no se descargó correctamente."
            exit 1
          fi
          
          echo "Descomprimiendo archivos..."
          unzip -q OpenBullet2.zip
          rm OpenBullet2.zip
          
          echo "Iniciando OpenBullet 2 en segundo plano..."
          nohup dotnet OpenBullet2.dll > ob2_console.log 2>&1 &
          
          echo "OpenBullet 2 instalado e iniciado en el puerto 5000."
        shell: bash
        
      - name: 📦 Instalar e Iniciar Cloudflare Tunnel
        run: |
          echo "Descargando e instalando cloudflared..."
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -O cloudflared.deb
          sudo dpkg -i cloudflared.deb
          
          if command -v cloudflared >/dev/null 2>&1; then
            echo "cloudflared instalado correctamente. Instalando servicio del túnel..."
            # Se utiliza el secreto guardado en GitHub Actions para proteger el token
            sudo cloudflared service install ${{ secrets.CLOUDFLARE_TOKEN }}
          else
            echo "Error al instalar cloudflared."
            exit 1
          fi
        shell: bash

      - name: Descargar e iniciar Bore (SSH)
        run: |
          echo "Obteniendo la última versión de bore para Linux..."
          ASSET_URL=$(curl -s https://api.github.com/repos/ekzhang/bore/releases/latest | grep "browser_download_url" | grep "x86_64-unknown-linux-musl.tar.gz" | cut -d '"' -f 4)
          
          wget -q $ASSET_URL -O bore.tar.gz
          tar -xzf bore.tar.gz
          chmod +x bore
          
          echo "Iniciando túnel SSH en segundo plano..."
          # Redirigimos el puerto 22 (SSH)
          nohup ./bore local 22 --to bore.pub > bore.log 2>&1 &
          
          # Esperamos para que el túnel se establezca
          sleep 5
          
          echo "========================================="
          echo "        🌐 DATOS DE CONEXIÓN SSH         "
          echo "========================================="
          echo "Host: bore.pub"
          echo "Usuario: runner"
          echo "Contraseña: GithubSsh2026!"
          echo ""
          echo "Puerto asignado:"
          cat bore.log | grep "listening at" | awk '{print $5}' | cut -d ':' -f 2
          echo "========================================="
          echo ""
          echo "Comando rápido para la terminal:"
          PUERTO=$(cat bore.log | grep "listening at" | awk '{print $5}' | cut -d ':' -f 2)
          echo "ssh runner@bore.pub -p $PUERTO"
          echo "========================================="
          echo "Nota: OpenBullet 2 y Cloudflare Tunnel ya están corriendo."
          echo "Puedes acceder a OB2 haciendo un túnel local a tu PC:"
          echo "ssh -L 5000:localhost:5000 runner@bore.pub -p $PUERTO"
          
          # Mantener la máquina encendida por 6 horas
          sleep 21600
        shell: bash
