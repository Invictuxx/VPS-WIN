- name: 🔐 Configurar contraseña de administrador de OpenBullet 2
        env:
          OB2_ADMIN_PASSWORD: ${{ secrets.OB2_ADMIN_PASSWORD }}
        run: |
          set -e

          # CORRECCIÓN: Se eliminó /UserData de la ruta
          CONFIG="$HOME/OpenBullet2/appsettings.json"

          if [ ! -f "$CONFIG" ]; then
            echo "Error: no se encontró $CONFIG"
            exit 1
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-bcrypt

          python3 <<'PY'
          import os
          import json
          import bcrypt
          import shutil

          config_path = os.path.expanduser("~/OpenBullet2/appsettings.json")
          password = os.environ.get("OB2_ADMIN_PASSWORD")

          if not password:
              raise SystemExit("ERROR: OB2_ADMIN_PASSWORD no está configurado.")

          shutil.copy2(config_path, config_path + ".bak")

          password_hash = bcrypt.hashpw(
              password.encode("utf-8"),
              bcrypt.gensalt(rounds=10)
          ).decode("utf-8")

          with open(config_path, "r", encoding="utf-8") as f:
              config = json.load(f)

          security = config.setdefault("SecuritySettings", {})
          security["RequireAdminLogin"] = True
          security["AdminPasswordHash"] = password_hash

          with open(config_path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print("Contraseña de administrador configurada correctamente.")
          PY

          python3 -m json.tool "$CONFIG" > /dev/null
